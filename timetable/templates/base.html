{% load static %}<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Smart Timetable{% endblock %}</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg-1:#0f172a;--bg-2:#312e81;--bg-3:#5b21b6;--card:rgba(255,255,255,.92);--panel:rgba(15,23,42,.68);--line:rgba(148,163,184,.25);--text:#0f172a;--muted:#475569;--indigo:#4f46e5;--violet:#7c3aed;--emerald:#10b981;--orange:#f59e0b;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at top left,#1d4ed8 0,#312e81 20%,#0f172a 65%);background-attachment:fixed;min-height:100vh;color:var(--text)}
.glass{background:var(--card);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.35);box-shadow:0 20px 60px rgba(15,23,42,.18)}
.soft-panel{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(18px)}
.lift{transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease}.lift:hover{transform:translateY(-4px);box-shadow:0 18px 45px rgba(79,70,229,.18)}
.emo{display:inline-block;cursor:default;user-select:none;transition:transform .35s cubic-bezier(.2,1.6,.4,1);will-change:transform}
.emo.idle{animation:bob 3.5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(4deg)}}
.emo.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.6) rotate(-14deg)}100%{transform:scale(1)}}
.now{animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.6)}100%{box-shadow:0 0 0 14px rgba(16,185,129,0)}}
.rise{animation:rise .55s both}@keyframes rise{from{opacity:0;transform:translateY(18px)} }
.badge{display:inline-flex;align-items:center;gap:.45rem;padding:.45rem .8rem;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.12);font-size:.78rem;font-weight:700;color:#e2e8f0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="text-slate-800">
<div class="container mx-auto px-4 py-8 max-w-7xl">
  {% block content %}{% endblock %}
  <footer class="mt-12 text-center text-sm text-indigo-100">
    <div class="inline-flex flex-wrap items-center justify-center gap-3 rounded-full soft-panel px-4 py-2">
      <a href="https://t.me/darsmakerbot" target="_blank" class="hover:text-white"><span class="emo">🤖</span> Telegram bot</a>
      <span class="opacity-60">•</span>
      <a href="/admin/" class="hover:text-white"><span class="emo">⚙️</span> Admin</a>
    </div>
    <p class="mt-3 opacity-80">© 2026 Smart Timetable</p>
  </footer>
</div>
<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const emos = () => document.querySelectorAll('.emo');
  const RADIUS = 120;
  addEventListener('pointermove', e => {
    if (reduce) return;
    emos().forEach(el => {
      const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      const dx = cx - e.clientX, dy = cy - e.clientY, dist = Math.hypot(dx, dy);
      if (dist < RADIUS) {
        const f = (1 - dist / RADIUS) * 30, k = f / (dist || 1);
        el.classList.remove('idle');
        el.style.transform = `translate(${dx * k}px,${dy * k}px) rotate(${dx * .3}deg) scale(1.14)`;
      } else if (el.style.transform) {
        el.style.transform = ''; el.classList.add('idle');
      }
    });
  }, {passive: true});

  document.addEventListener('pointerover', e => {
    const el = e.target.closest('.emo'); if (!el || el._t) return;
    el.classList.add('pop');
    el._t = setTimeout(() => { el.classList.remove('pop'); el._t = 0; }, 500);
  });

  document.querySelectorAll('[data-hover-emoji]').forEach(card => {
    const t = card.querySelector('.emo'); if (!t) return;
    const orig = t.textContent, alt = card.dataset.hoverEmoji;
    card.addEventListener('pointerenter', () => t.textContent = alt);
    card.addEventListener('pointerleave', () => t.textContent = orig);
  });
})();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
