{% load static %}<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Smart Timetable{% endblock %}</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#0f172a;--bg2:#312e81;--card:rgba(255,255,255,.94)}
body{font-family:Inter,system-ui,sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2) 55%,#4c1d95);background-attachment:fixed;min-height:100vh}
.glass{background:var(--card);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.4);box-shadow:0 10px 40px rgba(0,0,0,.25)}
.lift{transition:transform .25s,box-shadow .25s}.lift:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(0,0,0,.28)}
/* Harakatlanuvchi emojilar: kursor yaqinlashganda qochadi, ustiga borganda "pop" qiladi */
.emo{display:inline-block;cursor:default;user-select:none;transition:transform .35s cubic-bezier(.2,1.6,.4,1);will-change:transform}
.emo.idle{animation:bob 3.5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(4deg)}}
.emo.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.6) rotate(-14deg)}100%{transform:scale(1)}}
.now{animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}100%{box-shadow:0 0 0 14px rgba(34,197,94,0)}}
.rise{animation:rise .5s both}@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="text-slate-800">
<div class="container mx-auto px-4 py-8 max-w-7xl">{% block content %}{% endblock %}
<footer class="mt-12 text-center text-sm text-indigo-200">
  <a href="https://t.me/darsmakerbot" target="_blank" class="hover:text-white"><span class="emo">🤖</span> Telegram bot</a>
  <span class="mx-2">•</span><a href="/admin/" class="hover:text-white"><span class="emo">⚙️</span> Admin</a>
  <p class="mt-2 opacity-70">© 2026 Smart Timetable</p>
</footer></div>
<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const emos = () => document.querySelectorAll('.emo');
  const RADIUS = 110;
  // 1) kursor emojiga yaqinlashsa - undan qochadi (mobil: barmoq bilan ham)
  addEventListener('pointermove', e => {
    if (reduce) return;
    emos().forEach(el => {
      const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      const dx = cx - e.clientX, dy = cy - e.clientY, dist = Math.hypot(dx, dy);
      if (dist < RADIUS) {
        const f = (1 - dist / RADIUS) * 34, k = f / (dist || 1);
        el.classList.remove('idle');
        el.style.transform = `translate(${dx * k}px,${dy * k}px) rotate(${dx * .3}deg) scale(1.15)`;
      } else if (el.style.transform) { el.style.transform = ''; el.classList.add('idle'); }
    });
  }, {passive: true});
  // 2) emojiga tegilganda - pop + kichik emojilar yomg'iri
  const burst = (x, y, ch) => {
    if (reduce) return;
    for (let i = 0; i < 7; i++) {
      const s = document.createElement('span');
      s.textContent = ch; s.style.cssText = `position:fixed;left:${x}px;top:${y}px;pointer-events:none;font-size:${14 + Math.random() * 12}px;z-index:99`;
      document.body.appendChild(s);
      const a = Math.random() * Math.PI * 2, d = 40 + Math.random() * 60;
      s.animate([{transform: 'translate(0,0) scale(1)', opacity: 1},
                 {transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d - 30}px) scale(.3) rotate(${Math.random() * 360}deg)`, opacity: 0}],
                {duration: 800 + Math.random() * 400, easing: 'ease-out'}).onfinish = () => s.remove();
    }
  };
  document.addEventListener('pointerover', e => {
    const el = e.target.closest('.emo'); if (!el || el._t) return;
    el.classList.add('pop'); burst(e.clientX, e.clientY, el.textContent.trim());
    el._t = setTimeout(() => { el.classList.remove('pop'); el._t = 0; }, 600);
  });
  // bosh sahifa / kartalar uchun: ustiga kelganda emoji almashish
  document.querySelectorAll('[data-hover-emoji]').forEach(c => {
    const t = c.querySelector('.emo'); if (!t) return; const orig = t.textContent, alt = c.dataset.hoverEmoji;
    c.addEventListener('pointerenter', () => t.textContent = alt);
    c.addEventListener('pointerleave', () => t.textContent = orig);
  });
})();
</script>
{% block scripts %}{% endblock %}
</body></html>
